<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ABC Adventure</title><style>
body{font-family:system-ui;margin:0;background:linear-gradient(135deg,#7c4dff,#00bcd4);min-height:100vh;display:grid;place-items:center}.game{background:#fff;width:min(700px,92%);padding:25px;border-radius:28px;text-align:center;box-shadow:0 15px 45px #0003}h1{color:#673ab7;font-size:45px;margin:5px}.badges{display:flex;justify-content:space-around;font-weight:800}.card{background:#fff7dc;border:5px solid #ffd54f;border-radius:24px;padding:18px;margin:15px 0}.letter{font-size:130px;font-weight:1000;color:#ff7043;line-height:1}.emoji{font-size:80px}.word{font-size:42px;font-weight:900}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,input{padding:15px;border:0;border-radius:15px;font-size:18px;font-weight:800}button{cursor:pointer;background:#e8f5e9}.primary{background:#673ab7;color:#fff}.msg{min-height:32px;font-weight:900}@media(max-width:500px){.answers{grid-template-columns:1fr}.letter{font-size:100px}.word{font-size:32px}}</style></head><body><main class=game><h1>🌈 ABC Adventure</h1><input id=name placeholder="Enter your name"><button class=primary onclick=start>Start Game</button><div id=game hidden><div class=badges><span>⭐ <b id=score>0</b></span><span>🔤 <b id=round>1</b></span></div><div class=card><div class=letter id=letter>A</div><div class=emoji id=emoji>🍎</div><div class=word id=word>APPLE</div></div><div class=msg id=msg></div><div class=answers id=answers></div><p><button class=primary onclick=speak()>🔊 Hear</button></p></div></main><script>
let qs=[],cur,score=0,r=0,player,settings;
const $=id=>document.getElementById(id); const shuffle=a=>[...a].sort(()=>Math.random()-.5);
async function start(){let n=$("name").value.trim();if(!n)return alert("Enter your name");settings=await fetch("/api/settings").then(x=>x.json());qs=await fetch("/api/questions").then(x=>x.json());player=await fetch("/api/players",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n})}).then(x=>x.json());$("name").style.display="none";event.target.style.display="none";$("game").hidden=false;next()}
function next(){r++;if(r>Number(settings.rounds)){finish();return}cur=qs[Math.floor(Math.random()*qs.length)];$("round").textContent=r+"/"+settings.rounds;$("letter").textContent=cur.letter;$("emoji").textContent=cur.emoji;$("word").textContent=cur.word;$("msg").textContent="Which word starts with "+cur.letter+"?";let opts=shuffle(qs.filter(x=>x.id!==cur.id)).slice(0,3).concat(cur);$("answers").innerHTML="";shuffle(opts).forEach(x=>{let b=document.createElement("button");b.textContent=x.word;b.onclick=()=>answer(x);$("answers").appendChild(b)})}
function answer(x){if(x.id===cur.id){score+=Number(settings.points);$("score").textContent=score;$("msg").textContent="🎉 Correct!";speak()}else $("msg").textContent="😊 Try again! Answer: "+cur.word;setTimeout(next,700)}
function speak(){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(cur.letter+". "+cur.word))}
async function finish(){await fetch("/api/scores",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({playerId:player.id,score,rounds:r-1})});$("game").innerHTML="<h2>🏆 Game Complete!</h2><div style='font-size:60px'>⭐</div><h2>"+score+" points</h2><button class=primary onclick=location.reload()>Play Again</button>"}
</script></body></html>
