<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><title>ABC Adventure Admin</title><style>
body{font-family:system-ui;margin:0;background:#f4f1ff;padding:20px;color:#222}.wrap{max-width:1000px;margin:auto}.panel{background:white;padding:20px;border-radius:20px;margin:15px 0;box-shadow:0 5px 20px #0001}h1{color:#673ab7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}input,button{padding:12px;border-radius:10px;border:1px solid #ddd;font-size:16px}button{cursor:pointer;background:#673ab7;color:white;border:0}.stats{display:flex;gap:15px;flex-wrap:wrap}.stat{background:#eee;padding:15px;border-radius:12px;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}@media(max-width:700px){.grid{grid-template-columns:1fr}}\n</style></head><body><div class=wrap><h1>⚙️ ABC Adventure Admin</h1><p>Control your game content and settings.</p><div class=panel><h2>Dashboard</h2><div class=stats id=stats></div></div><div class=panel><h2>Game Settings</h2><div class=grid><label>Rounds<input id=rounds type=number></label><label>Points<input id=points type=number></label><label>Timer (0 = off)<input id=timer type=number></label></div><p><button onclick=saveSettings()>Save Settings</button></p></div><div class=panel><h2>Add Alphabet Question</h2><div class=grid><input id=letter placeholder="Letter (A)"><input id=emoji placeholder="Emoji 🍎"><input id=word placeholder="Word APPLE"></div><p><button onclick=addQ()>Add Question</button></p></div><div class=panel><h2>Questions</h2><table><thead><tr><th>Letter</th><th>Picture</th><th>Word</th><th>Action</th></tr></thead><tbody id=list></tbody></table></div><div class=panel><h2>Leaderboard</h2><div id=board></div></div></div><script>
async function load(){let [s,qs,st,lb]=await Promise.all([fetch("/api/settings").then(x=>x.json()),fetch("/api/questions").then(x=>x.json()),fetch("/api/stats").then(x=>x.json()),fetch("/api/leaderboard").then(x=>x.json())]);for(let k of ["rounds","points","timer"])document.getElementById(k).value=s[k]||0;$("stats").innerHTML=`<div class=stat>Players: ${st.players}</div><div class=stat>Games: ${st.games}</div><div class=stat>Questions: ${st.questions}</div>`;$("list").innerHTML=qs.map(q=>`<tr><td>${q.letter}</td><td>${q.emoji}</td><td>${q.word}</td><td><button onclick="del(${q.id})">Delete</button></td></tr>`).join("");$("board").innerHTML="<ol>"+lb.map(x=>`<li>${x.name} — ${x.score} pts (${x.games} games)</li>`).join("")+"</ol>"}const $=id=>document.getElementById(id);
async function saveSettings(){await fetch("/api/settings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({rounds:$("rounds").value,points:$("points").value,timer:$("timer").value})});alert("Settings saved");load()}
async function addQ(){await fetch("/api/questions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({letter:$("letter").value,emoji:$("emoji").value,word:$("word").value})});$("letter").value=$("emoji").value=$("word").value="";load()}
async function del(id){if(confirm("Delete this question?")){await fetch("/api/questions/"+id,{method:"DELETE"});load()}}load();
</script></body></html>
